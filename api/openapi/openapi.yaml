      properties:
        name:
          type: string
        description:
          type: string
        whatsapp:
          type: string
        city_code:
          type: string
        district:
          type: string
        address:
          type: string
        location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GeoPoint"
        logo_file_id:
          type: string
          nullable: true
    OrganizationResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Organization"
