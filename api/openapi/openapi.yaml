openapi: 3.0.3
info:
  title: Trustip API
  version: 1.0.0
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      responses:
        "200":
          description: Proses hidup
        "429":
          $ref: "#/components/responses/RateLimited"
  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      responses:
        "200":
          description: Basis data siap
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [system]
      responses:
        "200":
          description: Identitas dan versi API
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    RequestId:
      required: true
      schema:
        type: string
    RateLimitLimit:
      required: true
      schema:
        type: integer
    RateLimitRemaining:
      required: true
      schema:
        type: integer
    RateLimitReset:
      required: true
      schema:
        type: integer
    RetryAfter:
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Belum masuk, sesi habis, atau tanda tangan tepi tidak sah
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Terkena pembatasan laju
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Galat tak terduga
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Basis data sedang bangun atau layanan luar tidak menjawab
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNKNOWN_FIELD
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - EDGE_SIGNATURE_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - CAPTCHA_FAILED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
    ListMeta:
      type: object
      additionalProperties: false
      required: [request_id, next_cursor, has_more]
      properties:
        request_id:
          type: string
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, meta]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, errors, meta]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED]
        message:
          type: string
          minLength: 1
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    SuccessCode:
      type: string
      enum: [OK]
    Meta:
      type: object
      additionalProperties: false
      required: [name, version, server_time]
      properties:
        name:
          type: string
        version:
          type: string
        server_time:
          type: string
          format: date-time
    MetaResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Meta"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Readiness"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
