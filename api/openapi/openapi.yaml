components:
  headers:
    RequestId:
      required: true
      schema:
        type: string
    RateLimitLimit:
      required: true
      schema:
        type: integer
    RateLimitRemaining:
      required: true
      schema:
        type: integer
    RateLimitReset:
      required: true
      schema:
        type: integer
    Location:
      required: true
      schema:
        type: string
    SetCookie:
      required: true
      schema:
        type: string
    RetryAfter:
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Permintaan tidak terbaca atau memuat isian tak dikenal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Jenis isi selain application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Isian melanggar validasi, atau verifikasi keamanan gagal
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationErrorResponse"
              - $ref: "#/components/schemas/ErrorResponse"
    CrossSite:
      description: Permintaan tulis tanpa asal app atau tanpa kepala X-Trustip-Client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Peran tidak cukup, atau permintaan tulis dari situs lain
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Tidak ada, atau milik organisasi lain
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Bentrok dengan keadaan data saat ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Belum masuk, sesi habis, atau tanda tangan tepi tidak sah
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Terkena pembatasan laju
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Galat tak terduga
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Basis data sedang bangun atau layanan luar tidak menjawab
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
