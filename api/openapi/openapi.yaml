components:
  headers:
    RequestId:
      required: true
      schema:
        type: string
    IdempotentReplay:
      description: Ada bila jawaban adalah dokumen semula untuk kunci idempotensi yang sama
      schema:
        type: string
        enum: ["true"]
    RateLimitLimit:
      required: true
      schema:
        type: integer
    RateLimitRemaining:
      required: true
      schema:
        type: integer
    RateLimitReset:
      required: true
      schema:
        type: integer
    Location:
      required: true
      schema:
        type: string
    SetCookie:
      required: true
      schema:
        type: string
    RetryAfter:
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Permintaan tidak terbaca atau memuat isian tak dikenal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Jenis isi selain application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Isian melanggar validasi, atau verifikasi keamanan gagal
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationErrorResponse"
              - $ref: "#/components/schemas/ErrorResponse"
    CrossSite:
      description: Permintaan tulis tanpa asal app atau tanpa kepala X-Trustip-Client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Peran tidak cukup, atau permintaan tulis dari situs lain
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Tidak ada, atau milik organisasi lain
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Bentrok dengan keadaan data saat ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Belum masuk, sesi habis, atau tanda tangan tepi tidak sah
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Terkena pembatasan laju
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Galat tak terduga
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Basis data sedang bangun atau layanan luar tidak menjawab
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNKNOWN_FIELD
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - SESSION_REVOKED
        - LOGIN_FAILED
        - EDGE_SIGNATURE_INVALID
        - FORBIDDEN
        - CROSS_SITE_REJECTED
        - NOT_FOUND
        - CAPTCHA_FAILED
        - ORGANIZATION_EXISTS
        - PROFILE_INCOMPLETE
        - INVITE_WRONG_ORG_TYPE
        - PROPOSAL_EXPIRED
        - PROPOSAL_ALREADY_OPEN
        - ALREADY_PARTNERS
        - PROPOSAL_LIMIT_REACHED
        - PROPOSAL_COOLDOWN
        - NEED_LIMIT_REACHED
        - NEED_NOT_OPEN
        - ORGANIZATION_SUSPENDED
        - NOT_YOUR_TURN
        - PROPOSAL_ALREADY_DECIDED
        - PARTNERSHIP_NOT_ACTIVE
        - AGREEMENT_CHANGED
        - IDEMPOTENCY_KEY_REUSED
        - DOCUMENT_NOT_PENDING
        - CANCEL_WINDOW_PASSED
        - DROP_ALREADY_COUNTED
        - STOCK_CHANGED
        - SETTLEMENT_ALREADY_PAID
        - PAYMENT_PENDING
        - PARTNERSHIP_HAS_BLOCKERS
        - RATE_LIMITED
        - ACCOUNT_LOCKED
        - SERVICE_UNAVAILABLE
        - INTERNAL
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
    ListMeta:
      type: object
      additionalProperties: false
      required: [request_id, next_cursor, has_more]
      properties:
        request_id:
          type: string
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, meta]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, errors, meta]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED]
        message:
          type: string
          minLength: 1
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    SuccessCode:
      type: string
      enum: [OK]
    Meta:
      type: object
      additionalProperties: false
      required: [name, version, server_time]
      properties:
        name:
          type: string
        version:
          type: string
        server_time:
          type: string
          format: date-time
    MetaResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Meta"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Readiness:
