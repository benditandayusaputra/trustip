      properties:
        code:
          type: string
        name:
          type: string
        province_name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    CityListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/City"
        meta:
          $ref: "#/components/schemas/ListMeta"
    AccountResponse:
      type: object
