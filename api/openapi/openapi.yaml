  /api/v1/payments/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rejectPayment
      tags: [settlement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Penitip menolak pembayaran dengan alasan
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  headers:
    RequestId:
      required: true
      schema:
        type: string
    IdempotentReplay:
      description: Ada bila jawaban adalah dokumen semula untuk kunci idempotensi yang sama
      schema:
        type: string
        enum: ["true"]
    RateLimitLimit:
      required: true
      schema:
        type: integer
    RateLimitRemaining:
      required: true
      schema:
        type: integer
    RateLimitReset:
      required: true
      schema:
        type: integer
    Location:
      required: true
      schema:
        type: string
    SetCookie:
      required: true
      schema:
        type: string
    RetryAfter:
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Permintaan tidak terbaca atau memuat isian tak dikenal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Jenis isi selain application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Isian melanggar validasi, atau verifikasi keamanan gagal
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationErrorResponse"
              - $ref: "#/components/schemas/ErrorResponse"
    CrossSite:
      description: Permintaan tulis tanpa asal app atau tanpa kepala X-Trustip-Client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Peran tidak cukup, atau permintaan tulis dari situs lain
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Tidak ada, atau milik organisasi lain
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Bentrok dengan keadaan data saat ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Belum masuk, sesi habis, atau tanda tangan tepi tidak sah
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Terkena pembatasan laju
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Galat tak terduga
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Basis data sedang bangun atau layanan luar tidak menjawab
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNKNOWN_FIELD
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - SESSION_REVOKED
        - LOGIN_FAILED
        - EDGE_SIGNATURE_INVALID
        - FORBIDDEN
        - CROSS_SITE_REJECTED
        - NOT_FOUND
        - CAPTCHA_FAILED
        - ORGANIZATION_EXISTS
        - PROFILE_INCOMPLETE
        - INVITE_WRONG_ORG_TYPE
        - PROPOSAL_EXPIRED
        - PROPOSAL_ALREADY_OPEN
        - ALREADY_PARTNERS
        - NOT_YOUR_TURN
        - PROPOSAL_ALREADY_DECIDED
        - PARTNERSHIP_NOT_ACTIVE
        - AGREEMENT_CHANGED
        - IDEMPOTENCY_KEY_REUSED
        - DOCUMENT_NOT_PENDING
        - CANCEL_WINDOW_PASSED
        - DROP_ALREADY_COUNTED
        - STOCK_CHANGED
        - SETTLEMENT_ALREADY_PAID
        - PAYMENT_PENDING
        - RATE_LIMITED
        - ACCOUNT_LOCKED
        - SERVICE_UNAVAILABLE
        - INTERNAL
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
    ListMeta:
      type: object
      additionalProperties: false
      required: [request_id, next_cursor, has_more]
      properties:
        request_id:
          type: string
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, meta]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, errors, meta]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED]
        message:
          type: string
          minLength: 1
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    SuccessCode:
      type: string
      enum: [OK]
    Meta:
      type: object
      additionalProperties: false
      required: [name, version, server_time]
      properties:
        name:
          type: string
        version:
          type: string
        server_time:
          type: string
          format: date-time
    MetaResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Meta"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Readiness"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [full_name, email, password, whatsapp, privacy_accepted, captcha_token]
      properties:
        full_name:
          type: string
        email:
          type: string
        password:
          type: string
        whatsapp:
          type: string
        privacy_accepted:
          type: boolean
        captcha_token:
          type: string
    Account:
      type: object
      additionalProperties: false
      required: [id, full_name, email, membership]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        membership:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Membership"
    OrganizationType:
      type: string
      enum: [CONSIGNOR, STORE]
    Membership:
      type: object
      additionalProperties: false
      required: [organization_id, organization_type, role]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_type:
          $ref: "#/components/schemas/OrganizationType"
        role:
          type: string
          enum: [OWNER, STAFF]
    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [type, name, description, whatsapp, city_code, district, address, location]
      properties:
        type:
          type: string
        name:
          type: string
        description:
          type: string
        whatsapp:
          type: string
        city_code:
          type: string
        district:
          type: string
        address:
          type: string
        location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GeoPoint"
    Organization:
      type: object
      additionalProperties: false
      required:
        [id, type, name, slug, description, whatsapp, city_code, city_name, district, address, location, logo,
         store_profile, consignor_profile, payment, listing]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/OrganizationType"
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description:
          type: string
        whatsapp:
          type: string
        city_code:
          type: string
        city_name:
          type: string
        district:
          type: string
        address:
          type: string
        location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GeoPoint"
        logo:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImageRef"
        store_profile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StoreProfile"
        consignor_profile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConsignorProfile"
        payment:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentInfo"
        listing:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Listing"
    ListingRequest:
      type: object
      additionalProperties: false
      required: [is_listed]
      properties:
        is_listed:
          type: boolean
    Listing:
      type: object
      additionalProperties: false
      required: [is_listed, percent, items]
      properties:
        is_listed:
          type: boolean
        percent:
          type: integer
          minimum: 0
          maximum: 100
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [requirement, is_required, is_done]
            properties:
              requirement:
                type: string
                enum:
                  [NAME, CITY, LOCATION, STORE_TYPE, ACCEPTED_CATEGORY, ACTIVE_PRODUCT, DESCRIPTION, LOGO,
                   STORE_PHOTO, PAYMENT_INFO]
              is_required:
                type: boolean
              is_done:
                type: boolean
    ConsignorProfile:
      type: object
      additionalProperties: false
      required:
        [delivery_radius_km, delivery_days, preferred_store_types, business_id_no, distribution_permit_no,
         halal_cert_no, can_provide_sample]
      properties:
        delivery_radius_km:
          type: integer
          nullable: true
        delivery_days:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
        preferred_store_types:
          type: array
          items:
            $ref: "#/components/schemas/StoreType"
        business_id_no:
          type: string
        distribution_permit_no:
          type: string
        halal_cert_no:
          type: string
        can_provide_sample:
          type: boolean
    ConsignorProfileRequest:
      $ref: "#/components/schemas/ConsignorProfile"
    PaymentInfo:
      type: object
      additionalProperties: false
      required: [info, qr]
      properties:
        info:
          type: string
        qr:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImageRef"
    PaymentInfoRequest:
      type: object
      additionalProperties: false
      required: [payment_info, payment_qr_file_id]
      properties:
        payment_info:
          type: string
        payment_qr_file_id:
          type: string
          nullable: true
    StoreType:
      type: string
      enum: [GROCERY_STALL, LOCAL_MINIMARKET, SOUVENIR_SHOP, CANTEEN, CAFE, BAKERY, COOPERATIVE, MARKET_KIOSK, OTHER]
    StoreProfileFields:
      type: object
      required:
        [store_type, accepted_category_ids, accepts_fixed_deposit, accepts_commission, commission_min_bps,
         commission_max_bps, requires_distribution_permit, requires_halal, requires_sample, other_requirements,
         opening_hours]
      properties:
        store_type:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StoreType"
        accepted_category_ids:
          type: array
          items:
            type: string
        accepts_fixed_deposit:
          type: boolean
        accepts_commission:
          type: boolean
        commission_min_bps:
          type: integer
          nullable: true
        commission_max_bps:
          type: integer
          nullable: true
        requires_distribution_permit:
          type: boolean
        requires_halal:
          type: boolean
        requires_sample:
          type: boolean
        other_requirements:
          type: string
        opening_hours:
          type: string
    StoreProfile:
      allOf:
        - $ref: "#/components/schemas/StoreProfileFields"
        - type: object
          required: [photos]
          properties:
            photos:
              type: array
              items:
                $ref: "#/components/schemas/ImageRef"
    StoreProfileRequest:
      allOf:
        - $ref: "#/components/schemas/StoreProfileFields"
        - type: object
          required: [photo_file_ids]
          properties:
            photo_file_ids:
              type: array
              items:
                type: string
    Category:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          $ref: "#/components/schemas/ListMeta"
    ImageRef:
      type: object
      additionalProperties: false
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description, whatsapp, city_code, district, address, location, logo_file_id]
      properties:
        name:
          type: string
        description:
          type: string
        whatsapp:
          type: string
        city_code:
          type: string
        district:
          type: string
        address:
          type: string
        location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GeoPoint"
        logo_file_id:
          type: string
          nullable: true
    OrganizationResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Organization"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Province:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    ProvinceListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Province"
        meta:
          $ref: "#/components/schemas/ListMeta"
    City:
      type: object
      additionalProperties: false
      required: [code, name, province_name, latitude, longitude]
      properties:
        code:
          type: string
        name:
          type: string
        province_name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    CityListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/City"
        meta:
          $ref: "#/components/schemas/ListMeta"
    AccountResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Account"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, captcha_token]
      properties:
        email:
          type: string
        password:
          type: string
        captcha_token:
          type: string
    EmptyResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          nullable: true
          enum: [null]
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    StoredFile:
      type: object
      additionalProperties: false
      required: [id, purpose, visibility, content_type, size_bytes, width, height, url]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [LOGO, STORE_PHOTO, PAYMENT_QR, PRODUCT_PHOTO, PAYMENT_PROOF]
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        content_type:
          type: string
          enum: [image/jpeg, image/png]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
        width:
          type: integer
        height:
          type: integer
        url:
          type: string
    FileResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/StoredFile"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, title, body, link, is_read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        link:
          type: string
          pattern: "^/app(/.*)?$"
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        meta:
          $ref: "#/components/schemas/ListMeta"
    UnreadCount:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
    UnreadCountResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/UnreadCount"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ProductStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    ProductRequest:
      type: object
      additionalProperties: false
      required:
        - sku
        - name
        - category_id
        - unit
        - description
        - composition
        - net_content
        - photo_file_id
        - suggested_retail_price
        - suggested_deposit_price
        - shelf_life_days
      properties:
        sku:
          type: string
          maxLength: 20
        name:
          type: string
          minLength: 2
          maxLength: 80
        category_id:
          type: string
        unit:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 1000
        composition:
          type: string
          maxLength: 500
        net_content:
          type: string
          maxLength: 40
        photo_file_id:
          type: string
          nullable: true
        suggested_retail_price:
          type: integer
          minimum: 0
          maximum: 100000000
        suggested_deposit_price:
          type: integer
          minimum: 0
          maximum: 100000000
        shelf_life_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 730
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - sku
        - consignor_slug
        - name
        - category_id
        - category_name
        - unit
        - description
        - composition
        - net_content
        - photo
        - suggested_retail_price
        - suggested_deposit_price
        - shelf_life_days
        - status
        - is_seeking_stores
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        consignor_slug:
          type: string
        name:
          type: string
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        unit:
          type: string
        description:
          type: string
        composition:
          type: string
        net_content:
          type: string
        photo:
          allOf:
            - $ref: "#/components/schemas/ImageRef"
          nullable: true
        suggested_retail_price:
          type: integer
        suggested_deposit_price:
          type: integer
        shelf_life_days:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/ProductStatus"
        is_seeking_stores:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ProductListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/ListMeta"
    ProductSeekingRequest:
      type: object
      additionalProperties: false
      required: [is_seeking_stores]
      properties:
