openapi: 3.0.3
info:
  title: Trustip API
  version: 1.0.0
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      responses:
        "200":
          description: Proses hidup
        "429":
          $ref: "#/components/responses/RateLimited"
  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      responses:
        "200":
          description: Basis data siap
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [system]
      responses:
        "200":
          description: Identitas dan versi API
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users:
    post:
      operationId: registerUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Akun dibuat
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              $ref: "#/components/headers/Location"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions:
    post:
      operationId: logIn
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Masuk berhasil. Token akses dan token penyegar dipasang sebagai cookie HttpOnly, tidak pernah di isi jawaban
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      responses:
        "200":
          description: Token penyegar diputar. Pasangan cookie baru dipasang
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/logout:
    post:
      operationId: logOut
      tags: [auth]
      responses:
        "200":
          description: Keluarga sesi ini dicabut dan kedua cookie dihapus
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/logout-all:
    post:
      operationId: logOutEverywhere
      tags: [auth]
      responses:
        "200":
          description: Semua sesi pengguna dicabut dan kedua cookie dihapus
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me:
    get:
      operationId: getCurrentAccount
      tags: [auth]
      responses:
        "200":
          description: Akun pengguna yang sedang masuk
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/organizations:
    post:
      operationId: createOrganization
      tags: [org]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "201":
          description: Organisasi dan keanggotaan OWNER dibuat dalam satu transaksi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              $ref: "#/components/headers/Location"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/provinces:
    get:
      operationId: listProvinces
      tags: [org]
      responses:
        "200":
          description: Semua provinsi menurut kode Kemendagri
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvinceListResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/cities:
    get:
      operationId: listCities
      tags: [org]
      parameters:
        - name: province_code
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{2}$"
      responses:
        "200":
          description: Kabupaten dan kota di satu provinsi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityListResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  headers:
    RequestId:
      required: true
      schema:
        type: string
    RateLimitLimit:
      required: true
      schema:
        type: integer
    RateLimitRemaining:
      required: true
      schema:
        type: integer
    RateLimitReset:
      required: true
      schema:
        type: integer
    Location:
      required: true
      schema:
        type: string
    SetCookie:
      required: true
      schema:
        type: string
    RetryAfter:
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Permintaan tidak terbaca atau memuat isian tak dikenal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Jenis isi selain application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Isian melanggar validasi, atau verifikasi keamanan gagal
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationErrorResponse"
              - $ref: "#/components/schemas/ErrorResponse"
    CrossSite:
      description: Permintaan tulis tanpa asal app atau tanpa kepala X-Trustip-Client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Bentrok dengan keadaan data saat ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Belum masuk, sesi habis, atau tanda tangan tepi tidak sah
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Terkena pembatasan laju
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Galat tak terduga
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Basis data sedang bangun atau layanan luar tidak menjawab
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNKNOWN_FIELD
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - SESSION_REVOKED
        - LOGIN_FAILED
        - EDGE_SIGNATURE_INVALID
        - FORBIDDEN
        - CROSS_SITE_REJECTED
        - NOT_FOUND
        - CAPTCHA_FAILED
        - ORGANIZATION_EXISTS
        - RATE_LIMITED
        - ACCOUNT_LOCKED
        - SERVICE_UNAVAILABLE
        - INTERNAL
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
    ListMeta:
      type: object
      additionalProperties: false
      required: [request_id, next_cursor, has_more]
      properties:
        request_id:
          type: string
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, meta]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, errors, meta]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED]
        message:
          type: string
          minLength: 1
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    SuccessCode:
      type: string
      enum: [OK]
    Meta:
      type: object
      additionalProperties: false
      required: [name, version, server_time]
      properties:
        name:
          type: string
        version:
          type: string
        server_time:
          type: string
          format: date-time
    MetaResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Meta"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Readiness"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [full_name, email, password, whatsapp, privacy_accepted, captcha_token]
      properties:
        full_name:
          type: string
        email:
          type: string
        password:
          type: string
        whatsapp:
          type: string
        privacy_accepted:
          type: boolean
        captcha_token:
          type: string
    Account:
      type: object
      additionalProperties: false
      required: [id, full_name, email, membership]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        membership:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Membership"
    OrganizationType:
      type: string
      enum: [CONSIGNOR, STORE]
    Membership:
      type: object
      additionalProperties: false
      required: [organization_id, organization_type, role]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_type:
          $ref: "#/components/schemas/OrganizationType"
        role:
          type: string
          enum: [OWNER, STAFF]
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [type, name, description, whatsapp, city_code, district, address]
      properties:
        type:
          type: string
        name:
          type: string
        description:
          type: string
        whatsapp:
          type: string
        city_code:
          type: string
        district:
          type: string
        address:
          type: string
    Organization:
      type: object
      additionalProperties: false
      required: [id, type, name, slug, description, whatsapp, city_code, city_name, district, address]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/OrganizationType"
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description:
          type: string
        whatsapp:
          type: string
        city_code:
          type: string
        city_name:
          type: string
        district:
          type: string
        address:
          type: string
    OrganizationResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Organization"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Province:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    ProvinceListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Province"
        meta:
          $ref: "#/components/schemas/ListMeta"
    City:
      type: object
      additionalProperties: false
      required: [code, name, province_name]
      properties:
        code:
          type: string
        name:
          type: string
        province_name:
          type: string
    CityListResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/City"
        meta:
          $ref: "#/components/schemas/ListMeta"
    AccountResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Account"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, captcha_token]
      properties:
        email:
          type: string
        password:
          type: string
        captcha_token:
          type: string
    EmptyResponse:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code:
          $ref: "#/components/schemas/SuccessCode"
        message:
          type: string
        data:
          nullable: true
          enum: [null]
        meta:
          $ref: "#/components/schemas/ResponseMeta"
