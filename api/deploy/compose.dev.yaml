name: trustip-dev

services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: trustip
      POSTGRES_DB: trustip
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "trustip"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
